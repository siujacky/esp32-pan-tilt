; PlatformIO project config for the ESP32 Pan/Tilt controller.
; The sketch lives in esp32_pan_tilt/ (same folder the Arduino IDE opens), so
; both toolchains work: Arduino IDE opens esp32_pan_tilt/esp32_pan_tilt.ino,
; and PlatformIO builds the same folder via src_dir below.
;
;   Build : pio run
;   Flash : pio run -t upload
;   Serial: pio device monitor   (115200 baud)

[platformio]
src_dir = esp32_pan_tilt

[env:esp32dev]
; D1 FULLY RESOLVED on hardware (2026-08-09) - see lessonlearn.md sections 20-21.
; Measured root cause: lx16a-servo flips bus direction with pinMode(pin, OUTPUT|PULLUP)
; around every write, and on arduino-esp32 3.x pinMode() DETACHES the pad from the UART
; peripheral - so not one byte ever reached the wire. This is why one-pin half-duplex
; "only worked on core 1.0.x". An interim TX-only workaround restored motion but left the
; library bus object un-initialized; its remaining call sites were null-deref crash-reboots
; (reproduced + backtrace-decoded), fixed by removing the library objects entirely.
; FINAL resolution: a GPIO-matrix half-duplex engine in servo_backend.h (lxBusBegin /
; lxRawSend / lxRawRead): RX stays permanently attached to the bus pin, the U2TXD signal
; is matrix-routed to the pad only around each packet (esp_rom_gpio_connect_out_signal),
; released with gpio_set_direction - pinMode is never called on that pad. READS WORK:
; scan, per-servo config readback, ID verify, and live telemetry all verified on a real
; LX-16A (vin/temp/actual-angle stream in /status; RX even hears our own TX echo, which
; /lxtx uses as wire-level transmit proof).
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; -Wmissing-field-initializers catches the failure mode that bit us once: extending a struct
; (CtrlState gained 8 config members) silently value-initializes the omitted members of every
; EXISTING short aggregate assignment elsewhere - legal C++, no warning by default, and it zeroed
; a whole per-target calibration at boot. See lessonlearn.md section 18.
build_flags = -Wmissing-field-initializers
; Preferences.h is bundled with the ESP32 Arduino core (no lib_deps entry needed).
lib_deps =
	madhephaestus/ESP32Servo
	madhephaestus/lx16a-servo
	olikraus/U8g2
	adafruit/Adafruit NeoPixel
